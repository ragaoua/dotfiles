# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
  'exec-and-forget sketchybar',
  # Mission Control renders AeroSpace's windows way too small unless windows are
  # grouped by application. Only restart the Dock when the setting isn't set yet
  # See: https://nikitabobko.github.io/AeroSpace/guide#a-note-on-mission-control
  '''exec-and-forget /bin/bash -c '
    [ "$(defaults read com.apple.dock expose-group-apps 2>/dev/null)" = 1 ] && exit
    defaults write com.apple.dock expose-group-apps -bool true && killall Dock'
  '''
]

exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_changed PREVIOUS_WORKSPACE=$AEROSPACE_PREV_WORKSPACE CURRENT_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Start AeroSpace at login
start-at-login = true

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 50

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config option is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = []

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

focus-follows-mouse.enabled = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
gaps.inner.horizontal = 10
gaps.inner.vertical =   10
gaps.outer.left =       10
gaps.outer.bottom =     10
gaps.outer.top =        10
gaps.outer.right =      10

key-mapping.preset = 'qwerty'

# Azerty layout since key-mapping.preset doesn't have azerty
key-mapping.key-notation-to-key-code = {
  ampersand='1',
  eacute='2',
  quotedbl='3',
  apostrophe='4',
  parenleft='5',
  section='6',
  egrave='7',
  exclam='8',
  ccedilla='9',
  agrave='0',
  parenright='minus',
  minus='equal',
  equal='slash',
  a='q',
  q='a',
  z='w',
  w='z',
  m='semicolon',
  comma='m',
  semicolon='comma',
  colon='period',
}

# Finder windows should always float
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.finder'
run = ['layout floating']
check-further-callbacks = true

[mode.main.binding]
    ##########################################################################
    ##########################################################################
    ################################ COMMANDS ################################
    ##########################################################################
    ##########################################################################
    alt-enter = '''exec-and-forget osascript -e '
      tell application "Ghostty"
          new window
      end tell'
    '''
    alt-o = '''exec-and-forget osascript -e '
      tell application "Safari"
          make new document at end of documents
          activate
      end tell'
    '''

    ###########################################################################
    ###########################################################################
    ################################# LAYOUTS #################################
    ###########################################################################
    ###########################################################################
    alt-colon = 'layout h_accordion h_tiles'
    alt-p = 'resize smart +100'
    alt-m = 'resize smart -100'
    alt-equal = 'balance-sizes'

    # ctrl and cmd are switched inside Ghostty, so we'll map both
    # alt-ctrl-<h|j|k|l> to moving the current window around to avoid switching
    # between the two depending on the app
    alt-ctrl-shift-h = ['join-with left', 'mode main']
    alt-ctrl-shift-j = ['join-with down', 'mode main']
    alt-ctrl-shift-k = ['join-with up', 'mode main']
    alt-ctrl-shift-l = ['join-with right', 'mode main']
    alt-cmd-shift-h = ['join-with left', 'mode main']
    alt-cmd-shift-j = ['join-with down', 'mode main']
    alt-cmd-shift-k = ['join-with up', 'mode main']
    alt-cmd-shift-l = ['join-with right', 'mode main']

    ###########################################################################
    ###########################################################################
    ################################# WINDOWS #################################
    ###########################################################################
    ###########################################################################
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # ctrl and cmd are switched inside Ghostty, so we'll map both
    # alt-ctrl-<h|j|k|l> to moving the current window around to avoid switching
    # between the two depending on the app
    alt-ctrl-h = 'move left'
    alt-ctrl-j = 'move down'
    alt-ctrl-k = 'move up'
    alt-ctrl-l = 'move right'
    alt-cmd-h = 'move left'
    alt-cmd-j = 'move down'
    alt-cmd-k = 'move up'
    alt-cmd-l = 'move right'

    ##########################################################################
    ##########################################################################
    ############################### WORKSPACES ###############################
    ##########################################################################
    ##########################################################################
    # Use only the left hand side of the keyboard to control workspaces
    alt-a = 'workspace A'
    alt-b = 'workspace B'
    alt-c = 'workspace C'
    alt-d = 'workspace D'
    alt-e = 'workspace E'
    alt-f = 'workspace F'
    alt-g = 'workspace G'
    alt-q = 'workspace Q'
    alt-r = 'workspace R'
    alt-s = 'workspace S'
    alt-t = 'workspace T'
    alt-v = 'workspace V'
    alt-w = 'workspace W'
    alt-x = 'workspace X'
    alt-z = 'workspace Z'
    alt-shift-a = ['move-node-to-workspace A', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=A']
    alt-shift-b = ['move-node-to-workspace B', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=B']
    alt-shift-c = ['move-node-to-workspace C', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=C']
    alt-shift-d = ['move-node-to-workspace D', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=D']
    alt-shift-e = ['move-node-to-workspace E', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=E']
    alt-shift-f = ['move-node-to-workspace F', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=F']
    alt-shift-g = ['move-node-to-workspace G', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=G']
    alt-shift-q = ['move-node-to-workspace Q', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=Q']
    alt-shift-r = ['move-node-to-workspace R', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=R']
    alt-shift-s = ['move-node-to-workspace S', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=S']
    alt-shift-t = ['move-node-to-workspace T', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=T']
    alt-shift-v = ['move-node-to-workspace V', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=V']
    alt-shift-w = ['move-node-to-workspace W', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=W']
    alt-shift-x = ['move-node-to-workspace X', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=X']
    alt-shift-z = ['move-node-to-workspace Z', 'exec-and-forget sketchybar --trigger aerospace_node_moved_to_workspace WORKSPACE=Z']

    alt-tab = 'workspace-back-and-forth'

    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    ###########################################################################
    ###########################################################################
    ################################## MODES ##################################
    ###########################################################################
    ###########################################################################
    alt-shift-comma = 'mode service'

[mode.service.binding]
    esc = ['mode main']
    q = ['close', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

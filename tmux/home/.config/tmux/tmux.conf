# PREFIX
unbind C-,
set -g prefix C-,
bind C-, send-prefix

# GENERAL OPTIONS
set -g mouse on
set -g base-index 0 # 0 is reserved for the "bg" window, see scripts/bg.sh
set -g pane-base-index 1
set -g renumber-windows on
set -ga terminal-overrides ",xterm*:Tc"
set -g history-limit 50000
set -g copy-command "pbcopy"
set -g default-shell /opt/homebrew/bin/bash

# COPY MODE
set -g mode-keys vi
bind -T copy-mode-vi v if -F '#{selection_present}' 'send -X clear-selection' 'send -X begin-selection'
bind -T copy-mode-vi y if -F '#{selection_present}' 'send -X copy-selection' 'send -X copy-line' # "copy-line" would be "yy" in vi but tmux can't do multiple-sequential-keys keybinds
bind -T copy-mode-vi Y send -X begin-selection \; send -X end-of-line \; send -X cursor-left \; send -X copy-selection
bind -T copy-mode-vi Escape if -F '#{selection_present}' 'send -X clear-selection' 'send -X cancel'
bind -T copy-mode-vi ] send-keys -X next-prompt
bind -T copy-mode-vi [ send-keys -X previous-prompt
# Copy last command's output to the paste buffers registry and clipboard
bind Y if-shell -F '#{alternate_on}' \
  "display-message 'copy-last-output: unavailable in alternate screen'" \
  "copy-mode ; \
   send-keys -X previous-prompt -o ; \
   send-keys -X begin-selection ; \
   send-keys -X next-prompt ; \
   send-keys -X cursor-up ; \
   send-keys -X end-of-line ; \
   send-keys -X cursor-left \; \
   send-keys -X copy-pipe-and-cancel"

# KEYBINDS
## Reload the tmux conf
bind R source-file "${HOME}/.config/tmux/tmux.conf" \; display-message "Config reloaded!"

## Pane navigation
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

## Open new window/pane in current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

## Sessions
bind S command-prompt -p "Session name:" "new-session -s '%%' -c '#{pane_current_path}'"
bind X confirm-before -p "kill session #S? (y/n)" 'run-shell "${HOME}/.config/tmux/scripts/kill_current_session.sh"'

bind j command-prompt -p "Join pane (horizontal):" "join-pane -h -s '%%'"

## Scripts
bind C-c run-shell "${HOME}/.config/tmux/scripts/open_project_session.sh"
bind C-n command-prompt -p "Project name:" "run-shell '${HOME}/.config/tmux/scripts/create_project_and_open_session.sh \"%%\"'"
bind C-g command-prompt -p "Project slug:" "run-shell '${HOME}/.config/tmux/scripts/create_project_and_open_session.sh --gh-repo \"%%\"'"
bind C-b run-shell '${HOME}/.config/tmux/scripts/open_window.sh 1 bash'
bind C-v run-shell '${HOME}/.config/tmux/scripts/open_window.sh 2 nvim "nvim ."'
bind C-o run-shell '${HOME}/.config/tmux/scripts/open_window.sh 3 opencode opencode'
bind N run-shell -b 'notes.sh --popup "#{pane_current_path}"'
bind C-s run-shell -b 'secrets.sh --popup'
bind K run-shell -b 'kp.sh --popup'
bind T run-shell -b 'todo.sh --popup'

## Background processes (see scripts/bg.sh)
## Every session has a hidden "bg" window at index 0 (prefix 0 to look at it).
## prefix B: send the current pane to bg (asks for a label), or bring it back
##           when it's already in bg
## prefix b: pick a bg process (Enter to jump to it, x to kill it)
bind B if -F "#{==:#{window_name},bg}" {
  run-shell "${HOME}/.config/tmux/scripts/bg.sh fg '#{pane_id}'"
} {
  command-prompt -I "#{pane_current_command}" -p "Background label:" {
    run-shell "${HOME}/.config/tmux/scripts/bg.sh bg '#{pane_id}' '%%'"
  }
}
bind b choose-tree -Z \
  -f "#{&&:#{==:#{window_name},bg},#{!=:#{@bg_placeholder},1}}" \
  -F "#{?pane_format,#{@bg_label}#{?pane_dead, [exited: #{pane_dead_status}],},#{?window_format,#{?#{==:#{window_panes},1},#{@bg_label}#{?pane_dead, [exited: #{pane_dead_status}],},#{window_panes} processes},}}"

set-hook -g session-created 'run-shell -b "${HOME}/.config/tmux/scripts/bg.sh sync"'
set-hook -g window-unlinked 'run-shell -b "${HOME}/.config/tmux/scripts/bg.sh sync"'
set-hook -g pane-died 'run-shell -b "${HOME}/.config/tmux/scripts/bg.sh sync"'
set-hook -g after-kill-pane 'run-shell -b "${HOME}/.config/tmux/scripts/bg.sh sync"'
run-shell -b "${HOME}/.config/tmux/scripts/bg.sh sync"

# THEME
set -g @plugin "catppuccin/tmux"
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"

set -g status-position top
set -g status-justify "absolute-centre"
set -g status-left-length 0
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[fg=#{@thm_red}]  #{=/64/...:#{session_name}}},#{#[fg=#{@thm_blue}]  #{=/64/...:#{session_name}}}}"
set -ga status-left "#[fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"
set -ga status-left "#{?#{@bg_running},#[fg=#{@thm_teal}]   #{@bg_running} ,}#{?#{@bg_dead},#[fg=#{@thm_red}]   #{@bg_dead} ,}"
set -g status-right-length 0
set -g status-right "#[fg=#{@thm_green}]  #{pane_current_path} "

setw -g pane-border-status top
setw -g pane-border-format "  #{?#{@bg_label},#{@bg_label},#{pane_title} - #{pane_current_command}} "

# The "bg" window (index 0, see scripts/bg.sh) is hidden and shown as a counter
# in status-left. A separator would still be drawn next to it, so draw it inside
# the format instead: before every visible window but the first one (index 1).
set -g window-status-format "#{?#{==:#{window_name},bg},,#{?#{!=:#{window_index},1},#[fg=#{@thm_overlay_0} bg=terminal nobold]│#[default],} #I: #W }"
set -g window-status-current-format "#{?#{==:#{window_name},bg},,#{?#{!=:#{window_index},1},#[fg=#{@thm_overlay_0} bg=terminal nobold]│#[default],} #I: #W }"
set -g window-status-separator ""

set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"
set -g window-status-last-style "fg=#{@thm_peach}"

set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"

# TPM
set -g @plugin "tmux-plugins/tpm"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "${HOME}/.local/share/tmux/plugins"

if "test ! -d '#{TMUX_PLUGIN_MANAGER_PATH}/tpm'" \
 "run 'git clone https://github.com/tmux-plugins/tpm \"#{TMUX_PLUGIN_MANAGER_PATH}/tpm\" && \"#{TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins\"'"

run "${HOME}/.local/share/tmux/plugins/tpm/tpm"
